name: Build AimLine APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/aimline app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'AIMLINE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AimLine"
          include(":app")
          AIMLINE_EOF
          cat > build.gradle.kts <<'AIMLINE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          AIMLINE_EOF
          cat > gradle.properties <<'AIMLINE_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          AIMLINE_EOF
          cat > app/build.gradle.kts <<'AIMLINE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.aimline"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.aimline"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 6
                  versionName = "3.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          AIMLINE_EOF
          cat > app/src/main/AndroidManifest.xml <<'AIMLINE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Aim Line"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service
                      android:name=".TapService"
                      android:exported="true"
                      android:label="Aim Line auto-tap"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/tap_service" />
                  </service>
              </application>
          </manifest>
          AIMLINE_EOF
          cat > app/src/main/res/xml/tap_service.xml <<'AIMLINE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/tap_service_desc"
              android:notificationTimeout="100" />
          AIMLINE_EOF
          cat > app/src/main/res/values/strings.xml <<'AIMLINE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="tap_service_desc">Lets Aim Line tap the screen for you when the aim line points at the next circle. It does not read or collect anything on your screen.</string>
          </resources>
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/MainActivity.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.Manifest
          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.content.SharedPreferences
          import android.media.projection.MediaProjectionManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var logView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 0)
                  }
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 120, 48, 48)
                  }

                  col.addView(TextView(this).apply {
                      text = "Aim Line v3.2"
                      textSize = 20f
                  })

                  fun button(label: String, action: () -> Unit) {
                      col.addView(Button(this).apply {
                          text = label
                          setOnClickListener { action() }
                      })
                  }

                  button("1. Allow draw over other apps") {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  }
                  button("2. Start aim line") {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Do step 1 first", Toast.LENGTH_SHORT).show()
                      } else {
                          val mpm = getSystemService(MediaProjectionManager::class.java)
                          startActivityForResult(mpm.createScreenCaptureIntent(), 1)
                      }
                  }
                  button("Stop") { stopService(Intent(this, OverlayService::class.java)) }

                  // ---- auto-tap
                  col.addView(TextView(this).apply {
                      setPadding(0, 64, 0, 0)
                      text = "Auto-tap (optional)"
                      textSize = 18f
                  })
                  button("3. Turn on the auto-tap service (Accessibility)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  status = TextView(this)
                  col.addView(status)
                  col.addView(TextView(this).apply {
                      text = "If Android says \"Restricted setting\": open Settings > Apps > Aim Line, " +
                          "tap the three dots (top right), choose \"Allow restricted settings\", then try step 3 again."
                      textSize = 12f
                  })
                  col.addView(Switch(this).apply {
                      setPadding(0, 32, 0, 0)
                      text = "Tap automatically when the line points at the next circle"
                      isChecked = prefs.getBoolean("auto", false)
                      setOnCheckedChangeListener { _, on -> prefs.edit().putBoolean("auto", on).apply() }
                  })

                  // ---- tuning
                  col.addView(TextView(this).apply {
                      setPadding(0, 64, 0, 0)
                      text = "Tuning"
                      textSize = 18f
                  })
                  slider(col, prefs, "Line lead (raise if the line lags behind the sprite)", "lead", 0, 150, 65, " ms")
                  slider(col, prefs, "Tap lead (raise if taps land late, lower if early)", "taplead", 0, 250, 110, " ms")
                  slider(col, prefs, "Angle trim (only if the line is always rotated the same way)", "trim", -15, 15, 0, "\u00B0")

                  // ---- circle log
                  col.addView(TextView(this).apply {
                      setPadding(0, 64, 0, 0)
                      text = "Circle log (radius vs speed)"
                      textSize = 18f
                  })
                  col.addView(TextView(this).apply {
                      text = "Every circle you play is measured automatically. After 10-15 circles of different sizes, tap Copy log and send it to me."
                      textSize = 12f
                  })
                  logView = TextView(this).apply {
                      typeface = Typeface.MONOSPACE
                      textSize = 11f
                      setTextIsSelectable(true)
                      setPadding(0, 24, 0, 24)
                  }
                  col.addView(logView)
                  button("Refresh log") { refreshLog() }
                  button("Copy log") {
                      val cm = getSystemService(ClipboardManager::class.java)
                      cm.setPrimaryClip(ClipData.newPlainText("AimLine circle log", OrbitLog.export(this)))
                      Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show()
                  }
                  button("Share log") {
                      val send = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, OrbitLog.export(this))
                      startActivity(Intent.createChooser(send, "Share circle log"))
                  }
                  button("Clear log") { OrbitLog.clear(this); refreshLog() }

                  setContentView(ScrollView(this).apply { addView(col) })
              }

              private fun refreshLog() {
                  logView.text = OrbitLog.summary(this) + "\n\n" + OrbitLog.recent(this, 12)
              }

              override fun onResume() {
                  super.onResume()
                  refreshLog()
                  status.text = if (TapService.instance != null) {
                      "Auto-tap service: ON \u2713"
                  } else {
                      "Auto-tap service: OFF (turn on \"Aim Line auto-tap\" in Accessibility)"
                  }
              }

              private fun slider(
                  col: LinearLayout, prefs: SharedPreferences, title: String,
                  key: String, lo: Int, hi: Int, def: Int, unit: String
              ) {
                  val label = TextView(this).apply { setPadding(0, 40, 0, 0) }
                  val bar = SeekBar(this)
                  bar.max = hi - lo
                  fun show(v: Int) { label.text = "$title: $v$unit" }
                  val saved = prefs.getInt(key, def)
                  bar.progress = saved - lo
                  show(saved)
                  bar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar, p: Int, fromUser: Boolean) {
                          prefs.edit().putInt(key, p + lo).apply()
                          show(p + lo)
                      }
                      override fun onStartTrackingTouch(s: SeekBar) {}
                      override fun onStopTrackingTouch(s: SeekBar) {}
                  })
                  col.addView(label)
                  col.addView(bar)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1 && resultCode == RESULT_OK && data != null) {
                      startForegroundService(
                          Intent(this, OverlayService::class.java)
                              .putExtra("code", resultCode)
                              .putExtra("data", data)
                      )
                      Toast.makeText(this, "Running. Open your game now.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/Detector.java <<'AIMLINE_EOF'
          package com.example.aimline;

          /**
           * Pure-Java frame analysis (no Android classes, so it can be tested on a desktop JVM).
           *
           * Finds (1) the player sprite: the largest solid near-black blob, its centre, and which way
           * it faces, and (2) the star cores (dense clusters of dark dots) used as targets.
           *
           * The game has a white theme and a dark theme (everything's brightness swapped). Each frame the most common
           * brightness (= the background) is checked; in the dark theme the brightness of every pixel is flipped first,
           * so all the logic below only ever sees the white theme. In the white theme nothing is changed.
           *
           * Facing is the principal axis of the whole filled sprite shape (uses every pixel, so it is
           * stable), with the 180 degree ambiguity resolved by where the white iris ring sits.
           */
          public final class Detector {

              public static final class Result {
                  public float x, y;            // sprite centre (frame px)
                  public float angle;           // facing direction, radians (y axis points down)
                  public boolean confident;     // facing sign was decided by the iris ring
                  public boolean inverted;      // this frame was in the dark theme (brightness was flipped before analysis)
                  public float tip;             // distance from centre to the nose along the facing direction
                  public int bx0, by0, bx1, by1;
                  public float[] stars = new float[0];   // x0,y0,x1,y1,...
                  public int starCount;
              }

              private static final int DARK = 60;
              private static final int LIGHT = 150;
              private static final int STAR_DARK = 150;
              private static final int COLOR_LIMIT = 70;   // coloured pixels (our own overlay) are ignored
              private static final double MIN_FRAC = 0.0004;
              private static final double MAX_FRAC = 0.02;
              private static final int MAX_STARS = 12;
              private static final double STAR_DENSITY = 0.16;

              private final int w, h;
              private final byte[] lum;
              private final boolean[] seen;
              private final int[] qa, qb;
              private final int[] integral;
              private final int boxR;
              private final int step = 2;
              private final int gw, gh;
              private final boolean[] gridHit;
              private final float[] gridDen;
              private final int[] gridQ;

              public Detector(int w, int h) {
                  this.w = w;
                  this.h = h;
                  lum = new byte[w * h];
                  seen = new boolean[w * h];
                  qa = new int[w * h];
                  qb = new int[w * h];
                  integral = new int[(w + 1) * (h + 1)];
                  boxR = Math.max(3, Math.round(0.016f * w));
                  gw = w / step;
                  gh = h / step;
                  gridHit = new boolean[gw * gh];
                  gridDen = new float[gw * gh];
                  gridQ = new int[gw * gh];
              }

              private int lumAt(int i) { return lum[i] & 255; }

              // ---- theme (background brightness) tracking
              private final int[] hist = new int[16];
              private boolean inverted, polarityKnown;
              private int flips;

              /** The most common brightness is the background: light = white theme, dark = dark theme. */
              private void decidePolarity() {
                  int best = 0, total = 0;
                  for (int b = 0; b < 16; b++) {
                      total += hist[b];
                      if (hist[b] > hist[best]) best = b;
                  }
                  if (total < 200) return;                           // nothing to judge from (e.g. a fully coloured screen): keep the last answer
                  boolean wantInverted = best < 8;
                  if (!polarityKnown) { inverted = wantInverted; polarityKnown = true; flips = 0; return; }
                  if (wantInverted == inverted) { flips = 0; return; }
                  // a clear change (background is at least half of the screen) switches at once, an unclear one must repeat
                  if (hist[best] * 2 >= total || ++flips >= 3) { inverted = wantInverted; flips = 0; }
              }

              public Result detect(byte[] px, int stride) {
                  java.util.Arrays.fill(hist, 0);
                  for (int y = 0; y < h; y++) {
                      int o = y * stride;
                      int row = y * w;
                      boolean sampleRow = (y & 3) == 0;
                      for (int x = 0; x < w; x++) {
                          int r = px[o] & 255, g = px[o + 1] & 255, b = px[o + 2] & 255;
                          int mx = Math.max(r, Math.max(g, b));
                          int mn = Math.min(r, Math.min(g, b));
                          int v;
                          if (mx - mn > COLOR_LIMIT) {
                              v = 255;                                  // coloured (our own overlay): always "not dark"
                          } else {
                              v = ((r + g + b) * 85) >> 8;              // 0..254, so 255 is only ever the coloured marker
                              if (sampleRow && (x & 3) == 0) hist[v >> 4]++;
                          }
                          lum[row + x] = (byte) v;
                          o += 4;
                      }
                  }
                  decidePolarity();
                  if (inverted) {
                      // dark theme: flip brightness so that the sprite is dark and the background light, like the white theme
                      int all = w * h;
                      for (int i = 0; i < all; i++) {
                          int v = lum[i] & 255;
                          if (v != 255) lum[i] = (byte) (254 - v);
                      }
                  }

                  // ---- largest 4-connected dark blob = the sprite
                  java.util.Arrays.fill(seen, false);
                  int bestN = 0;
                  int[] cur = qa;
                  int[] bestQ = qb;
                  int total = w * h;
                  for (int s = 0; s < total; s++) {
                      if (lumAt(s) >= DARK || seen[s]) continue;
                      int head = 0, tail = 0;
                      cur[tail++] = s;
                      seen[s] = true;
                      while (head < tail) {
                          int p = cur[head++];
                          int x = p % w;
                          int y = p / w;
                          int q;
                          if (x > 0) { q = p - 1; if (!seen[q] && lumAt(q) < DARK) { seen[q] = true; cur[tail++] = q; } }
                          if (x < w - 1) { q = p + 1; if (!seen[q] && lumAt(q) < DARK) { seen[q] = true; cur[tail++] = q; } }
                          if (y > 0) { q = p - w; if (!seen[q] && lumAt(q) < DARK) { seen[q] = true; cur[tail++] = q; } }
                          if (y < h - 1) { q = p + w; if (!seen[q] && lumAt(q) < DARK) { seen[q] = true; cur[tail++] = q; } }
                      }
                      if (tail > bestN) {
                          bestN = tail;
                          int[] t = cur; cur = bestQ; bestQ = t;
                      }
                  }
                  if (bestN < total * MIN_FRAC || bestN > total * MAX_FRAC) return null;

                  int x0 = w, x1 = 0, y0 = h, y1 = 0;
                  for (int i = 0; i < bestN; i++) {
                      int x = bestQ[i] % w, y = bestQ[i] / w;
                      if (x < x0) x0 = x;
                      if (x > x1) x1 = x;
                      if (y < y0) y0 = y;
                      if (y > y1) y1 = y;
                  }
                  int bw = x1 - x0 + 1, bh = y1 - y0 + 1;
                  boolean[] inC = new boolean[bw * bh];
                  for (int i = 0; i < bestN; i++) inC[(bestQ[i] / w - y0) * bw + (bestQ[i] % w - x0)] = true;

                  // flood from the box border: whatever is not reached and not blob is an enclosed hole
                  boolean[] out = new boolean[bw * bh];
                  int[] q = new int[bw * bh];
                  int head = 0, tail = 0;
                  for (int x = 0; x < bw; x++) {
                      int k = x; if (!inC[k] && !out[k]) { out[k] = true; q[tail++] = k; }
                      k = (bh - 1) * bw + x; if (!inC[k] && !out[k]) { out[k] = true; q[tail++] = k; }
                  }
                  for (int y = 0; y < bh; y++) {
                      int k = y * bw; if (!inC[k] && !out[k]) { out[k] = true; q[tail++] = k; }
                      k = y * bw + bw - 1; if (!inC[k] && !out[k]) { out[k] = true; q[tail++] = k; }
                  }
                  while (head < tail) {
                      int k = q[head++];
                      int x = k % bw, y = k / bw, n;
                      if (x > 0) { n = k - 1; if (!inC[n] && !out[n]) { out[n] = true; q[tail++] = n; } }
                      if (x < bw - 1) { n = k + 1; if (!inC[n] && !out[n]) { out[n] = true; q[tail++] = n; } }
                      if (y > 0) { n = k - bw; if (!inC[n] && !out[n]) { out[n] = true; q[tail++] = n; } }
                      if (y < bh - 1) { n = k + bw; if (!inC[n] && !out[n]) { out[n] = true; q[tail++] = n; } }
                  }

                  // ---- moments of the filled shape
                  double sx = 0, sy = 0;
                  int fn = 0;
                  for (int y = 0; y < bh; y++) for (int x = 0; x < bw; x++) {
                      if (out[y * bw + x]) continue;
                      sx += x; sy += y; fn++;
                  }
                  if (fn == 0) return null;
                  double lcx = sx / fn, lcy = sy / fn;
                  double sxx = 0, syy = 0, sxy = 0, rx = 0, ry = 0;
                  int rn = 0;
                  for (int y = 0; y < bh; y++) for (int x = 0; x < bw; x++) {
                      int k = y * bw + x;
                      if (out[k]) continue;
                      double dx = x - lcx, dy = y - lcy;
                      sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
                      if (!inC[k] && lumAt((y0 + y) * w + x0 + x) > LIGHT) { rx += x; ry += y; rn++; }
                  }
                  double phi = 0.5 * Math.atan2(2 * sxy, sxx - syy);
                  double ux = Math.cos(phi), uy = Math.sin(phi);

                  double m3 = 0, maxPlus = 0, maxMinus = 0;
                  for (int y = 0; y < bh; y++) for (int x = 0; x < bw; x++) {
                      if (out[y * bw + x]) continue;
                      double p = (x - lcx) * ux + (y - lcy) * uy;
                      m3 += p * p * p;
                      if (p > maxPlus) maxPlus = p;
                      if (-p > maxMinus) maxMinus = -p;
                  }

                  double sign;
                  boolean confident = false;
                  if (rn >= 10) {
                      double e = (rx / rn - lcx) * ux + (ry / rn - lcy) * uy;
                      if (Math.abs(e) >= 0.004 * w) { sign = e > 0 ? 1 : -1; confident = true; }
                      else sign = m3 >= 0 ? 1 : -1;
                  } else {
                      sign = m3 >= 0 ? 1 : -1;
                  }

                  Result res = new Result();
                  res.x = (float) (x0 + lcx + 0.5);
                  res.y = (float) (y0 + lcy + 0.5);
                  res.angle = (float) Math.atan2(sign * uy, sign * ux);
                  res.confident = confident;
                  res.tip = (float) (sign > 0 ? maxPlus : maxMinus);
                  res.bx0 = x0; res.by0 = y0; res.bx1 = x1; res.by1 = y1;
                  res.inverted = inverted;

                  findStars(res);
                  return res;
              }

              /** Star cores = dense clusters of dark dots. Spokes, ring dots and the aim line are too sparse to pass. */
              private void findStars(Result res) {
                  int pad = Math.max(4, Math.round(0.03f * w));
                  int top = (int) (0.06 * h), bottom = (int) (0.82 * h);
                  int W1 = w + 1;
                  java.util.Arrays.fill(integral, 0);
                  for (int y = 0; y < h; y++) {
                      int rowSum = 0;
                      boolean band = y >= top && y < bottom;
                      boolean inSpriteRows = y >= res.by0 - pad && y <= res.by1 + pad;
                      for (int x = 0; x < w; x++) {
                          boolean on = band && lumAt(y * w + x) < STAR_DARK;
                          if (on && inSpriteRows && x >= res.bx0 - pad && x <= res.bx1 + pad) on = false;
                          if (on) rowSum++;
                          integral[(y + 1) * W1 + x + 1] = integral[y * W1 + x + 1] + rowSum;
                      }
                  }
                  int area = (2 * boxR + 1) * (2 * boxR + 1);
                  double need = STAR_DENSITY * area;
                  java.util.Arrays.fill(gridHit, false);
                  for (int gy = 0; gy < gh; gy++) {
                      int cy = gy * step;
                      int ya = Math.max(0, cy - boxR), yb = Math.min(h - 1, cy + boxR);
                      for (int gx = 0; gx < gw; gx++) {
                          int cx = gx * step;
                          int xa = Math.max(0, cx - boxR), xb = Math.min(w - 1, cx + boxR);
                          int s = integral[(yb + 1) * W1 + xb + 1] - integral[ya * W1 + xb + 1]
                                  - integral[(yb + 1) * W1 + xa] + integral[ya * W1 + xa];
                          if (s >= need) { gridHit[gy * gw + gx] = true; gridDen[gy * gw + gx] = (float) s / area; }
                      }
                  }
                  // label the dense regions, then merge fragments of the same core
                  final int cap = 32;
                  double[] ccx = new double[cap], ccy = new double[cap], cw = new double[cap];
                  int[] cn = new int[cap];
                  int nc = 0;
                  for (int s = 0; s < gw * gh && nc < cap; s++) {
                      if (!gridHit[s]) continue;
                      int head = 0, tail = 0;
                      gridQ[tail++] = s;
                      gridHit[s] = false;
                      double wx = 0, wy = 0, ws = 0;
                      while (head < tail) {
                          int p = gridQ[head++];
                          int gx = p % gw, gy = p / gw;
                          double wt = gridDen[p];
                          wx += wt * gx; wy += wt * gy; ws += wt;
                          for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
                              int nx = gx + dx, ny = gy + dy;
                              if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
                              int n = ny * gw + nx;
                              if (gridHit[n]) { gridHit[n] = false; gridQ[tail++] = n; }
                          }
                      }
                      ccx[nc] = wx / ws * step + 0.5; ccy[nc] = wy / ws * step + 0.5; cw[nc] = ws; cn[nc] = tail;
                      nc++;
                  }
                  double mergeD = 0.055 * w;
                  boolean merged = true;
                  while (merged) {
                      merged = false;
