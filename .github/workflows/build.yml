               * phi = atan2(T - C) - s * acos(R / |T - C|).
               */
              static double solveRelease(double cx, double cy, double R, double s, double trim,
                                         double tx, double ty, double phi0) {
                  final int steps = 144;
                  final double h = 2 * Math.PI / steps;
                  double[] dot = new double[1];
                  double prevF = miss(cx, cy, R, s, trim, tx, ty, phi0, dot);
                  double prevA = 0;
                  for (int k = 1; k <= steps; k++) {
                      double a = k * h;
                      double f = miss(cx, cy, R, s, trim, tx, ty, phi0 + s * a, dot);
                      if ((prevF < 0 && f >= 0) || (prevF > 0 && f <= 0)) {
                          double lo = prevA, hi = a, flo = prevF;
                          for (int it = 0; it < 30; it++) {
                              double mid = 0.5 * (lo + hi);
                              double fm = miss(cx, cy, R, s, trim, tx, ty, phi0 + s * mid, dot);
                              if ((flo < 0) == (fm < 0)) { lo = mid; flo = fm; } else hi = mid;
                          }
                          double root = 0.5 * (lo + hi);
                          miss(cx, cy, R, s, trim, tx, ty, phi0 + s * root, dot);
                          if (dot[0] > 0.5 * R) return root;
                      }
                      prevF = f;
                      prevA = a;
                  }
                  return Double.NaN;
              }

              private void chooseTarget(double tc, long arrivalMs, Detector.Result r) {
                  locked = false;
                  if (!orbitActive || !haveFit) { targetKnown = false; return; }
                  // the next circle = the nearest star above the one being circled
                  int best = -1;
                  double bestD = 1e18;
                  for (int j = 0; j < r.starCount; j++) {
                      double sx = r.stars[2 * j], sy = r.stars[2 * j + 1];
                      double d = Math.hypot(sx - oCx, sy - oCy);
                      if (d < 1.12 * oR) continue;                 // the star we are circling, or too close for a tangent to reach
                      if (sy > oCy - 0.3 * oR) continue;           // only circles above
                      if (d < bestD) { bestD = d; best = j; }
                  }
                  if (best < 0) { targetKnown = false; return; }
                  double sx = r.stars[2 * best], sy = r.stars[2 * best + 1];
                  if (targetKnown && Math.hypot(sx - tx, sy - ty) < 0.3 * oR) {
                      tx += 0.3 * (sx - tx);
                      ty += 0.3 * (sy - ty);
                  } else {
                      tx = sx; ty = sy; targetKnown = true;
                  }

                  double s = oOm > 0 ? 1 : -1;
                  double phiNow = oPhi + oOm * (tc - oT) / 1000.0;
                  double ahead = solveRelease(oCx, oCy, oR, s, Math.toRadians(trimDeg), tx, ty, phiNow);
                  if (Double.isNaN(ahead)) return;
                  double tRel = tc + ahead / Math.abs(oOm) * 1000.0;     // when the sprite faces the target dead on
                  locked = tRel - tc < 300;

                  // only tap once the circle comes from the sprite's own path (not just the star centre) and has settled
                  if (centreFromPath) { if (pathSince < 0) pathSince = tc; } else pathSince = -1;
                  boolean steady = pathSince >= 0 && tc - pathSince > 150 && n >= 8 && clockFrames > 45;
                  // a small or fast circle needs a full turn of data first: an error in its centre or speed is magnified there
                  if ((oR < 0.7 * r0 || Math.abs(oOm) > 6) && Math.abs(oOm) * (tc - orbitStartT) / 1000.0 < TURN_MIN) steady = false;
                  double tAt = tRel - tapLeadMs;
                  double inMs = tAt - arrivalMs;
                  // a tap that would be more than a hair late waits for the next pass instead of landing off-line
                  if (autoTap && steady && inMs <= 90 && inMs >= -12 && tc - tFire > 500) {
                      fireAtMs = Math.max(tAt, (double) arrivalMs);
                      tFire = fireAtMs;
                      tReleaseExp = tRel;
                  }
              }

              private Snapshot snapshot() {
                  Snapshot s = new Snapshot();
                  s.t = tLast;
                  s.visible = has;
                  s.x = (float) x; s.y = (float) y; s.theta = (float) thFly;
                  s.vx = (float) vx; s.vy = (float) vy; s.tip = (float) tip;
                  s.hasTarget = orbitActive && targetKnown;
                  s.locked = locked;
                  s.tx = (float) tx; s.ty = (float) ty; s.tr = (float) (haveFit ? oR : r0);
                  if (orbitActive && haveFit) {
                      s.orbit = true;
                      s.t = oT;
                      s.ocx = (float) oCx; s.ocy = (float) oCy; s.oR = (float) oR;
                      s.oPhi = (float) oPhi; s.oOmega = (float) oOm;
                      s.oTrim = (float) Math.toRadians(trimDeg);
                      if (tReleaseExp > 0 && tLast - tFire < 700) s.hideFrom = tReleaseExp + 50;
                  }
                  return s;
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/LineView.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin

          /**
           * Transparent, touch-through view. It re-draws on every screen refresh and extrapolates the
           * last detection forward in time, so the line moves smoothly and stays ahead of capture lag.
           */
          class LineView(context: Context) : View(context) {
              @Volatile var snap: AimEngine.Snapshot? = null
              @Volatile var leadMs = 65f

              private val pos = FloatArray(3)
              private val loc = IntArray(2)

              // Orange / green are strongly coloured, so the detector (which only looks at grey pixels)
              // never mistakes the overlay for the game's sprite or stars.
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(255, 120, 0)
                  strokeWidth = 7f
                  strokeCap = Paint.Cap.ROUND
                  pathEffect = DashPathEffect(floatArrayOf(1f, 20f), 0f)
              }
              private val lockPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(0, 210, 90)
                  strokeWidth = 9f
                  strokeCap = Paint.Cap.ROUND
                  pathEffect = DashPathEffect(floatArrayOf(1f, 20f), 0f)
              }
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(0, 210, 90)
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private val ringDim = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(110, 0, 210, 90)
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
              }

              override fun onDraw(canvas: Canvas) {
                  val s = snap ?: return
                  val now = SystemClock.uptimeMillis()
                  if (!s.visible || now - s.t > 400) return
                  if (s.orbit && now >= s.hideFrom) return      // the tap has just released the sprite: the orbit line is over
                  s.at(now, leadMs, pos)

                  // draw in true screen coordinates even if the system offsets this window (insets, cutouts)
                  getLocationOnScreen(loc)
                  canvas.save()
                  canvas.translate(-loc[0].toFloat(), -loc[1].toFloat())

                  val ux = cos(pos[2])
                  val uy = sin(pos[2])
                  val x0 = pos[0] + ux * s.tip      // start at the nose, where the game's own line starts
                  val y0 = pos[1] + uy * s.tip
                  val len = hypot(width.toFloat(), height.toFloat())
                  canvas.drawLine(x0, y0, x0 + ux * len, y0 + uy * len, if (s.locked) lockPaint else paint)
                  if (s.hasTarget) canvas.drawCircle(s.tx, s.ty, s.tr, if (s.locked) ringPaint else ringDim)
                  canvas.restore()
                  postInvalidateOnAnimation()
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/TapService.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          /** Lets the app tap the screen for you. It only ever sends the single tap that AimLine asks for. */
          class TapService : AccessibilityService() {

              private val main = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  if (instance === this) instance = null
                  return super.onUnbind(intent)
              }

              fun tap(x: Float, y: Float) {
                  main.post { dispatch(x, y) }
              }

              /** Sends the tap at an exact moment (SystemClock.uptimeMillis timeline), not "as soon as possible". */
              fun tapAt(x: Float, y: Float, uptimeMs: Long) {
                  main.postAtTime({ dispatch(x, y) }, uptimeMs)
              }

              private fun dispatch(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, 35L)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  dispatchGesture(gesture, null, null)
              }

              companion object {
                  @Volatile
                  var instance: TapService? = null
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/OverlayService.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.WindowManager

          class OverlayService : Service() {

              private var projection: MediaProjection? = null
              private var vDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var overlay: LineView? = null
              private var wm: WindowManager? = null
              private val thread = HandlerThread("aimline-detect").apply { start() }
              private lateinit var handler: Handler

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || intent.action == ACTION_STOP) { stopSelf(); return START_NOT_STICKY }
                  if (projection != null) return START_NOT_STICKY
                  handler = Handler(thread.looper)

                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("aim", "Aim line", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(
                      this, 0, Intent(this, OverlayService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopAction = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_delete), "Stop", stopPi
                  ).build()
                  val notif = Notification.Builder(this, "aim")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentTitle("Aim line is running")
                      .addAction(stopAction)
                      .build()
                  startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)

                  val code = intent.getIntExtra("code", 0)
                  val data = intent.getParcelableExtra<Intent>("data") ?: run { stopSelf(); return START_NOT_STICKY }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)

                  val windowManager = getSystemService(WindowManager::class.java)
                  wm = windowManager
                  val bounds = windowManager.maximumWindowMetrics.bounds
                  val sw = bounds.width()
                  val sh = bounds.height()
                  // analyse a frame that is roughly 540 px wide, whatever the screen size
                  val scale = Math.round(sw / 540f).coerceAtLeast(1)
                  val cw = sw / scale
                  val ch = sh / scale
                  val fx = sw.toFloat() / cw
                  val fy = sh.toFloat() / ch

                  val view = LineView(this)
                  overlay = view
                  val lp = WindowManager.LayoutParams(
                      sw, sh,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  windowManager.addView(view, lp)

                  val detector = Detector(cw, ch)
                  val engine = AimEngine(cw)
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  val img = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2)
                  reader = img
                  var bytes = ByteArray(0)
                  var lastRun = 0L

                  img.setOnImageAvailableListener({ r ->
                      val image = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val now = SystemClock.uptimeMillis()
                          if (now - lastRun < 20) return@setOnImageAvailableListener
                          lastRun = now
                          val plane = image.planes[0]
                          val buf = plane.buffer
                          if (bytes.size != buf.remaining()) bytes = ByteArray(buf.remaining())
                          buf.get(bytes)

                          engine.autoTap = prefs.getBoolean("auto", false)
                          engine.tapLeadMs = prefs.getInt("taplead", 110).toFloat()
                          engine.trimDeg = prefs.getInt("trim", 0).toFloat()
                          view.leadMs = prefs.getInt("lead", 65).toFloat()

                          val res = detector.detect(bytes, plane.rowStride)
                          view.snap = engine.update(now, image.timestamp, res).scaled(fx, fy)
                          if (engine.fireAtMs >= 0) {
                              TapService.instance?.tapAt(sw * 0.5f, sh * 0.6f, engine.fireAtMs.toLong())
                          }
                          while (true) {
                              val rec = engine.pollRecord() ?: break
                              OrbitLog.add(applicationContext, rec)
                          }
                          view.postInvalidate()
                      } finally {
                          image.close()
                      }
                  }, handler)

                  vDisplay = proj.createVirtualDisplay(
                      "aimline", cw, ch, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, img.surface, null, handler
                  )
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  vDisplay?.release()
                  reader?.close()
                  projection?.stop()
                  overlay?.let { runCatching { wm?.removeView(it) } }
                  thread.quitSafely()
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_STOP = "com.example.aimline.STOP"
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/OrbitLog.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.content.Context
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.ln

          /**
           * Remembers every circle the sprite orbits: how big it was and how fast the sprite went round.
           * Written by the overlay service, shown (and copied / shared) on the main screen.
           */
          object OrbitLog {
              private const val FILE = "orbits.csv"
              private const val MAX_ROWS = 300
              private const val HEADER = "time,radius_pct_of_width,omega_rad_per_s,speed_widths_per_s,seconds_in_circle"

              private fun file(c: Context) = File(c.filesDir, FILE)

              @Synchronized
              private fun rows(c: Context): MutableList<String> {
                  val f = file(c)
                  if (!f.exists()) return mutableListOf()
                  return f.readLines().filter { it.isNotBlank() && it != HEADER }.toMutableList()
              }

              /** rec = {radius / frame width, signed rad/s, speed in frame widths/s, seconds in the circle} */
              @Synchronized
              fun add(c: Context, rec: DoubleArray) {
                  val rows = rows(c)
                  val time = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  rows.add(String.format(Locale.US, "%s,%.2f,%.3f,%.3f,%.1f", time, rec[0] * 100, rec[1], rec[2], rec[3]))
                  while (rows.size > MAX_ROWS) rows.removeAt(0)
                  file(c).writeText((listOf(HEADER) + rows).joinToString("\n") + "\n")
              }

              @Synchronized
              fun clear(c: Context) {
                  file(c).delete()
              }

              fun recent(c: Context, n: Int): String {
                  val r = rows(c)
                  if (r.isEmpty()) return "(no circles logged yet)"
                  return (listOf("time      R%w   rad/s  w/s   sec") + r.takeLast(n).map { it.replace(",", "  ") }).joinToString("\n")
              }

              /** Plain-language reading of the log: how the speed changes with the radius. */
              fun summary(c: Context): String {
                  val all = rows(c).mapNotNull { row ->
                      val p = row.split(",")
                      if (p.size < 5) null else doubleArrayOf(p[1].toDouble(), abs(p[2].toDouble()), p[3].toDouble())
                  }
                  if (all.size < 3) return "Circles logged: ${all.size}. Play a few more (ideally of different sizes)."
                  // one odd record (a false circle) must not decide the result: drop sizes far from the typical one
                  val med = all.map { it[0] }.sorted()[all.size / 2]
                  val d = all.filter { it[0] > 0.5 * med && it[0] < 2.0 * med }
                  val skipped = all.size - d.size
                  val rMin = d.minOf { it[0] }
                  val rMax = d.maxOf { it[0] }
                  val oMin = d.minOf { it[1] }
                  val oMax = d.maxOf { it[1] }
                  val oAvg = d.map { it[1] }.average()
                  val extra = if (skipped > 0) " (+$skipped odd ones ignored)" else ""
                  val head = String.format(
                      Locale.US, "Circles logged: %d%s, radius %.1f-%.1f%% of width, turn rate %.2f-%.2f rad/s (avg %.2f).",
                      d.size, extra, rMin, rMax, oMin, oMax, oAvg
                  )
                  val n = d.size.toDouble()
                  if (rMax / rMin < 1.6) {
                      val mr = d.map { it[0] }.average()
                      var cov = 0.0; var vr = 0.0; var vo = 0.0
                      for (v in d) {
                          cov += (v[0] - mr) * (v[1] - oAvg)
                          vr += (v[0] - mr) * (v[0] - mr)
                          vo += (v[1] - oAvg) * (v[1] - oAvg)
                      }
                      val corr = if (vr > 0 && vo > 0) cov / Math.sqrt(vr * vo) else 0.0
                      return String.format(
                          Locale.US,
                          "%s\nAll circles are about the same size, so size does not explain the speed changes (correlation %.2f).",
                          head, corr
                      )
                  }
                  var sx = 0.0; var sy = 0.0; var sxx = 0.0; var sxy = 0.0
                  for (v in d) {
                      val x = ln(v[0]); val y = ln(v[1])
                      sx += x; sy += y; sxx += x * x; sxy += x * y
                  }
                  val a = (n * sxy - sx * sy) / (n * sxx - sx * sx)
                  val k = exp((sy - a * sx) / n)
                  val meaning = when {
                      a < -0.75 && a > -1.25 -> "the sprite moves at about the same speed along every circle (small circles spin faster)"
                      a > -0.25 && a < 0.25 -> "the sprite turns at about the same rate on every circle"
                      else -> "speed depends on the radius in a mixed way"
                  }
                  return String.format(Locale.US, "%s\nFit: omega = %.2f x R^%.2f (R in %% of width) -> %s.", head, k, a, meaning)
              }

              /** Everything, as text to paste or share. */
              fun export(c: Context): String {
                  val r = rows(c)
                  return summary(c) + "\n\n" + HEADER + "\n" + r.joinToString("\n")
              }
          }
          AIMLINE_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AimLine-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AimLine build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
