              /** Algebraic least-squares circle through cnt points of (ax, ay) starting at off. out = {cx, cy, radius}. */
              private static boolean circleFit(double[] ax, double[] ay, int off, int cnt, double[] out) {
                  double mx = 0, my = 0;
                  for (int i = off; i < off + cnt; i++) { mx += ax[i]; my += ay[i]; }
                  mx /= cnt; my /= cnt;
                  double suu = 0, svv = 0, suv = 0, suuu = 0, svvv = 0, suvv = 0, svuu = 0;
                  for (int i = off; i < off + cnt; i++) {
                      double u = ax[i] - mx, v = ay[i] - my;
                      suu += u * u; svv += v * v; suv += u * v;
                      suuu += u * u * u; svvv += v * v * v; suvv += u * v * v; svuu += v * u * u;
                  }
                  double det = suu * svv - suv * suv;
                  if (Math.abs(det) < 1e-6) return false;
                  double b1 = 0.5 * (suuu + suvv), b2 = 0.5 * (svvv + svuu);
                  double uc = (b1 * svv - b2 * suv) / det;
                  double vc = (suu * b2 - suv * b1) / det;
                  out[0] = mx + uc;
                  out[1] = my + vc;
                  out[2] = Math.sqrt(uc * uc + vc * vc + (suu + svv) / cnt);
                  return true;
              }

              // ------------------------------------------------------------------ target and release time

              /**
               * Cross product of the heading with the direction to the target, for a sprite at orbit phase phi.
               * Zero means the heading points straight at the target. dot[0] receives the distance along the heading.
               */
              private static double miss(double cx, double cy, double R, double s, double trim,
