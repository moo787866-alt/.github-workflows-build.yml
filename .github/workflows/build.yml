          package com.example.aimline

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin

          /**
           * Transparent, touch-through view. It re-draws on every screen refresh and extrapolates the
           * last detection forward in time, so the line moves smoothly and stays ahead of capture lag.
           */
          class LineView(context: Context) : View(context) {
              @Volatile var snap: AimEngine.Snapshot? = null
              @Volatile var leadMs = 60f

              private val pos = FloatArray(3)
              private val loc = IntArray(2)

              // Orange / green are strongly coloured, so the detector (which only looks at grey pixels)
              // never mistakes the overlay for the game's sprite or stars.
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(255, 120, 0)
                  strokeWidth = 7f
                  strokeCap = Paint.Cap.ROUND
                  pathEffect = DashPathEffect(floatArrayOf(1f, 20f), 0f)
              }
              private val lockPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(0, 210, 90)
                  strokeWidth = 9f
                  strokeCap = Paint.Cap.ROUND
                  pathEffect = DashPathEffect(floatArrayOf(1f, 20f), 0f)
              }
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(0, 210, 90)
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }

              override fun onDraw(canvas: Canvas) {
                  val s = snap ?: return
                  val now = SystemClock.uptimeMillis()
                  if (!s.visible || now - s.t > 400) return
                  s.at(now, leadMs, pos)

                  // draw in true screen coordinates even if the system offsets this window (insets, cutouts)
                  getLocationOnScreen(loc)
                  canvas.save()
                  canvas.translate(-loc[0].toFloat(), -loc[1].toFloat())

                  val ux = cos(pos[2])
                  val uy = sin(pos[2])
                  val x0 = pos[0] + ux * s.tip      // start at the nose, where the game's own line starts
                  val y0 = pos[1] + uy * s.tip
                  val len = hypot(width.toFloat(), height.toFloat())
                  canvas.drawLine(x0, y0, x0 + ux * len, y0 + uy * len, if (s.locked) lockPaint else paint)
                  if (s.locked) canvas.drawCircle(s.tx, s.ty, s.tr, ringPaint)
                  canvas.restore()
                  postInvalidateOnAnimation()
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/TapService.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          /** Lets the app tap the screen for you. It only ever sends the single tap that AimLine asks for. */
          class TapService : AccessibilityService() {

              private val main = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  if (instance === this) instance = null
                  return super.onUnbind(intent)
              }

              fun tap(x: Float, y: Float) {
                  main.post {
                      val path = Path().apply { moveTo(x, y) }
                      val stroke = GestureDescription.StrokeDescription(path, 0L, 35L)
                      val gesture = GestureDescription.Builder().addStroke(stroke).build()
                      dispatchGesture(gesture, null, null)
                  }
              }

              companion object {
                  @Volatile
                  var instance: TapService? = null
              }
          }
          AIMLINE_EOF
          cat > app/src/main/java/com/example/aimline/OverlayService.kt <<'AIMLINE_EOF'
          package com.example.aimline

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.WindowManager

          class OverlayService : Service() {

              private var projection: MediaProjection? = null
              private var vDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var overlay: LineView? = null
              private var wm: WindowManager? = null
              private val thread = HandlerThread("aimline-detect").apply { start() }
              private lateinit var handler: Handler

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || intent.action == ACTION_STOP) { stopSelf(); return START_NOT_STICKY }
                  if (projection != null) return START_NOT_STICKY
                  handler = Handler(thread.looper)

                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("aim", "Aim line", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(
                      this, 0, Intent(this, OverlayService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopAction = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_delete), "Stop", stopPi
                  ).build()
                  val notif = Notification.Builder(this, "aim")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentTitle("Aim line is running")
                      .addAction(stopAction)
                      .build()
                  startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)

                  val code = intent.getIntExtra("code", 0)
                  val data = intent.getParcelableExtra<Intent>("data") ?: run { stopSelf(); return START_NOT_STICKY }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)

                  val windowManager = getSystemService(WindowManager::class.java)
                  wm = windowManager
                  val bounds = windowManager.maximumWindowMetrics.bounds
                  val sw = bounds.width()
                  val sh = bounds.height()
                  // analyse a frame that is roughly 540 px wide, whatever the screen size
                  val scale = Math.round(sw / 540f).coerceAtLeast(1)
                  val cw = sw / scale
                  val ch = sh / scale
                  val fx = sw.toFloat() / cw
                  val fy = sh.toFloat() / ch

                  val view = LineView(this)
                  overlay = view
                  val lp = WindowManager.LayoutParams(
                      sw, sh,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  windowManager.addView(view, lp)

                  val detector = Detector(cw, ch)
                  val engine = AimEngine(cw)
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  val img = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2)
                  reader = img
                  var bytes = ByteArray(0)
                  var lastRun = 0L

                  img.setOnImageAvailableListener({ r ->
                      val image = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val now = SystemClock.uptimeMillis()
                          if (now - lastRun < 20) return@setOnImageAvailableListener
                          lastRun = now
                          val plane = image.planes[0]
                          val buf = plane.buffer
                          if (bytes.size != buf.remaining()) bytes = ByteArray(buf.remaining())
                          buf.get(bytes)

                          engine.autoTap = prefs.getBoolean("auto", false)
                          engine.tapLeadMs = prefs.getInt("taplead", 110).toFloat()
                          engine.trimDeg = prefs.getInt("trim", 0).toFloat()
                          view.leadMs = prefs.getInt("lead", 60).toFloat()

                          val res = detector.detect(bytes, plane.rowStride)
                          view.snap = engine.update(now, res).scaled(fx, fy)
                          if (engine.fire) {
                              TapService.instance?.tap(sw * 0.5f, sh * 0.6f)
                          }
                          view.postInvalidate()
                      } finally {
                          image.close()
                      }
                  }, handler)

                  vDisplay = proj.createVirtualDisplay(
                      "aimline", cw, ch, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, img.surface, null, handler
                  )
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  vDisplay?.release()
                  reader?.close()
                  projection?.stop()
                  overlay?.let { runCatching { wm?.removeView(it) } }
                  thread.quitSafely()
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_STOP = "com.example.aimline.STOP"
              }
          }
          AIMLINE_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AimLine-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AimLine build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
